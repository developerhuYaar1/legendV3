services:
  - type: web
    name: legendv3
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FYERS_APP_ID
        sync: false
      - key: FYERS_SECRET_ID
        sync: false
      - key: FYERS_REDIRECT_URI
        sync: false
      - key: LEGEND_CAPTURE_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
